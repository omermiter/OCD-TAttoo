services:
  - type: web
    name: ocd-tattoo
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: RESEND_API_KEY
        sync: false
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
